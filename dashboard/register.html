<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qᴜᴇᴇɴ X — Register</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #070707;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 24px;
      padding: 35px 25px;
    }

    h1 {
      text-align: center;
      font-size: 40px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 18px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #181818;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 14px;
    }

    .login a {
      color: white;
      text-decoration: none;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #555;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Qᴜᴇᴇɴ X</h1>

    <div class="subtitle">
      Create your dashboard account
    </div>

    <form id="registerForm">

      <label>Username</label>
      <input
        type="text"
        id="username"
        placeholder="Choose a username"
        required
      >

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        required
      >

      <label>Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        required
      >

      <button type="submit">
        CREATE ACCOUNT
      </button>

    </form>

    <div class="login">
      Already have an account?
      <a href="/login.html">Login</a>
    </div>

    <div class="footer">
      Qᴜᴇᴇɴ X • Powered by Simon Tech
    </div>

  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      alert("Registration system will be connected next.");
      window.location.href = "/login.html";
    });
  </script>

</body>
</html>
