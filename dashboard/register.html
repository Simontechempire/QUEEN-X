<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>QUEEN X Register</title>

<style>

body{
  margin:0;
  min-height:100vh;
  background:#050505;
  color:white;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:400px;
  background:#151515;
  padding:30px;
  border-radius:20px;
  border:1px solid #292929;
  text-align:center;
}

h1{
  margin-bottom:5px;
}

p{
  color:#777;
  font-size:13px;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:15px;
  margin:7px 0;
  border-radius:12px;
  border:1px solid #333;
  background:#090909;
  color:white;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:white;
  color:black;
  font-weight:bold;
}

button:disabled{
  opacity:.5;
}

a{
  color:#55ff88;
  text-decoration:none;
}

#message{
  margin-top:15px;
  font-size:13px;
}

</style>

</head>

<body>

<div class="box">

<h1>👑 QUEEN X</h1>

<p>Create your dashboard account</p>

<form id="registerForm">

<input
  id="username"
  type="text"
  placeholder="Username"
  required
>

<input
  id="email"
  type="email"
  placeholder="Email"
  required
>

<input
  id="password"
  type="password"
  placeholder="Password"
  required
>

<input
  id="confirmPassword"
  type="password"
  placeholder="Confirm Password"
  required
>

<button
  id="registerBtn"
  type="submit"
>
📝 CREATE ACCOUNT
</button>

</form>

<div id="message"></div>

<p>
Already have an account?
<a href="/login.html">
Login
</a>
</p>

</div>


<script>

document
  .getElementById(
    "registerForm"
  )
  .addEventListener(
    "submit",
    async function(event){

      event.preventDefault();

      const username =
        document
          .getElementById(
            "username"
          )
          .value
          .trim();

      const email =
        document
          .getElementById(
            "email"
          )
          .value
          .trim();

      const password =
        document
          .getElementById(
            "password"
          )
          .value;

      const confirmPassword =
        document
          .getElementById(
            "confirmPassword"
          )
          .value;

      const message =
        document.getElementById(
          "message"
        );

      const button =
        document.getElementById(
          "registerBtn"
        );


      if(
        password !==
        confirmPassword
      ){

        message.style.color =
          "#ff5555";

        message.textContent =
          "❌ Passwords do not match.";

        return;

      }


      button.disabled =
        true;

      button.textContent =
        "⏳ CREATING...";


      try{

        const response =
          await fetch(
            "/api/register",
            {
              method:"POST",
              headers:{
                "Content-Type":
                  "application/json"
              },
              body:
                JSON.stringify({
                  username,
                  email,
                  password
                })
            }
          );


        const data =
          await response.json();


        if(
          !response.ok ||
          !data.success
        ){

          throw new Error(
            data.message ||
            "Registration failed."
          );

        }


        message.style.color =
          "#55ff88";

        message.textContent =
          "✅ Account created successfully!";


        setTimeout(
          () => {

            window.location.href =
              "/login.html";

          },
          700
        );


      }catch(error){

        message.style.color =
          "#ff5555";

        message.textContent =
          "❌ " +
          error.message;

        button.disabled =
          false;

        button.textContent =
          "📝 CREATE ACCOUNT";

      }

    }
  );

</script>

</body>

</html>
