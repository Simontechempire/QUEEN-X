<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>QUEEN X Login</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:400px;
  background:#151515;
  padding:30px;
  border-radius:20px;
  border:1px solid #292929;
  text-align:center;
  box-shadow:0 25px 70px rgba(0,0,0,.6);
}

h1{
  margin:0 0 5px;
  font-size:32px;
}

p{
  color:#777;
  font-size:13px;
}

input{
  width:100%;
  padding:15px;
  margin:7px 0;
  border-radius:12px;
  border:1px solid #333;
  background:#090909;
  color:white;
  outline:none;
  font-size:14px;
}

input:focus{
  border-color:#55ff88;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:white;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

a{
  color:#55ff88;
  text-decoration:none;
}

#message{
  margin-top:15px;
  font-size:13px;
  line-height:1.5;
}

.loading{
  color:#ffaa55;
}

.success{
  color:#55ff88;
}

.error{
  color:#ff5555;
}
</style>
</head>

<body>

<div class="box">

  <h1>👑 QUEEN X</h1>

  <p>Login to your dashboard</p>

  <input
    id="email"
    type="email"
    autocomplete="email"
    placeholder="Email"
  >

  <input
    id="password"
    type="password"
    autocomplete="current-password"
    placeholder="Password"
  >

  <button
    id="loginBtn"
    onclick="login()"
  >
    🔐 LOGIN
  </button>

  <div id="message"></div>

  <p>
    Don't have an account?
    <a href="/register.html">Create Account</a>
  </p>

</div>

<script>

async function login(){

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("loginBtn");


  const email =
    emailInput.value.trim().toLowerCase();

  const password =
    passwordInput.value;


  message.className="";
  message.textContent="";


  if(!email){

    message.className="error";
    message.textContent=
      "❌ Enter your email.";

    emailInput.focus();
    return;
  }


  if(!password){

    message.className="error";
    message.textContent=
      "❌ Enter your password.";

    passwordInput.focus();
    return;
  }


  button.disabled=true;
  button.textContent=
    "⏳ LOGIN...";

  message.className="loading";
  message.textContent=
    "⏳ Checking your account...";


  try{

    const response =
      await fetch(
        "/api/login",
        {
          method:"POST",

          credentials:"include",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            email:email,
            password:password
          })
        }
      );


    let data;

    try{

      data =
        await response.json();

    }catch{

      throw new Error(
        "Server returned an invalid response."
      );

    }


    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Invalid email or password."
      );
    }


    message.className="success";
    message.textContent=
      "✅ Login successful! Opening dashboard...";


    setTimeout(
      () => {

        window.location.replace(
          "/dashboard"
        );

      },
      500
    );


  }catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );


    message.className="error";
    message.textContent=
      "❌ " +
      (
        error.message ||
        "Login failed."
      );


    button.disabled=false;

    button.textContent=
      "🔐 LOGIN";
  }

}

</script>

</body>
</html>
