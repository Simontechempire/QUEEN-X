<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>QUEEN X Login</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:400px;
  background:#151515;
  padding:30px;
  border-radius:20px;
  border:1px solid #292929;
  text-align:center;
  box-shadow:0 10px 40px rgba(0,0,0,.4);
}

h1{
  margin:0 0 5px;
}

p{
  color:#777;
  font-size:13px;
}

input{
  width:100%;
  padding:15px;
  margin:7px 0;
  border-radius:12px;
  border:1px solid #333;
  background:#090909;
  color:white;
  outline:none;
}

input:focus{
  border-color:#55ff88;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:white;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

a{
  color:#55ff88;
  text-decoration:none;
}

#message{
  margin-top:15px;
  font-size:13px;
  min-height:18px;
}

</style>

</head>

<body>

<div class="box">

  <h1>👑 QUEEN X</h1>

  <p>Login to your dashboard</p>

  <input
    id="username"
    type="text"
    placeholder="Username"
    autocomplete="username"
  >

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button
    id="loginBtn"
    onclick="login()"
  >
    🔐 LOGIN
  </button>

  <div id="message"></div>

  <p>
    Don't have an account?
    <a href="/register.html">
      Register
    </a>
  </p>

</div>

<script>

async function login(){

  const username =
    document
      .getElementById("username")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("loginBtn");

  if(!username || !password){

    message.style.color =
      "#ff5555";

    message.textContent =
      "❌ Enter username and password.";

    return;
  }

  button.disabled = true;

  button.textContent =
    "⏳ LOGIN...";

  message.textContent = "";

  try{

    const response =
      await fetch(
        "/api/login",
        {
          method:"POST",

          credentials:"same-origin",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              username: username,
              password: password
            })
        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Login failed."
      );

    }

    message.style.color =
      "#55ff88";

    message.textContent =
      "✅ Login successful.";

    setTimeout(() => {

      window.location.href =
        "/dashboard";

    }, 500);

  }catch(error){

    message.style.color =
      "#ff5555";

    message.textContent =
      "❌ " +
      error.message;

    button.disabled = false;

    button.textContent =
      "🔐 LOGIN";

  }

}

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){
        login();
      }

    }
  );

</script>

</body>

</html>
