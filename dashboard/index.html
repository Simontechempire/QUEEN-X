<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>QUEEN X Dashboard</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  padding:20px;
}

.dashboard{
  width:100%;
  max-width:480px;
  background:#111;
  border:1px solid #292929;
  border-radius:25px;
  padding:25px;
  box-shadow:0 20px 60px #000;
}

.header{
  text-align:center;
  margin-bottom:25px;
}

.header h1{
  font-size:40px;
  letter-spacing:3px;
}

.header p{
  color:#777;
  font-size:13px;
  margin-top:6px;
}

.user{
  color:#55ff88;
  font-size:12px;
  margin-top:12px;
}

.card{
  background:#181818;
  border:1px solid #292929;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
}

.card h2{
  font-size:17px;
  margin-bottom:8px;
}

.card p{
  color:#888;
  font-size:13px;
  line-height:1.5;
  margin-bottom:15px;
}

.status{
  color:#55ff88;
  font-weight:bold;
  font-size:14px;
}

input{
  width:100%;
  padding:15px;
  background:#090909;
  color:white;
  border:1px solid #333;
  border-radius:12px;
  outline:none;
  font-size:15px;
}

button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  background:white;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

.secondary{
  background:#242424;
  color:white;
  border:1px solid #333;
}

.result{
  display:none;
  margin-top:14px;
  padding:15px;
  background:#090909;
  border:1px dashed #333;
  border-radius:12px;
}

.code{
  font-size:30px;
  font-weight:bold;
  color:#55ff88;
  text-align:center;
  padding:15px;
  margin:12px 0;
  background:#111;
  border-radius:10px;
  letter-spacing:5px;
}

.success{
  color:#55ff88;
}

.error{
  color:#ff5555;
}

.info{
  color:#aaa;
  font-size:13px;
  line-height:1.5;
}

.actions{
  display:flex;
  gap:8px;
}

.actions button{
  flex:1;
}

.footer{
  text-align:center;
  color:#444;
  font-size:11px;
  margin-top:20px;
}

</style>

</head>

<body>

<main class="dashboard">

<div class="header">

<h1>QUEEN X</h1>

<p>WHATSAPP MD • ULTRA</p>

<div
  id="user"
  class="user"
>
Loading account...
</div>

</div>


<div class="card">

<h2>📡 Bot Status</h2>

<div
  id="status"
  class="status"
>
Checking...
</div>

</div>


<div class="card">

<h2>📱 Link WhatsApp</h2>

<p>
Enter your WhatsApp number with country code.
Do not use + or spaces.
<br><br>
Example: 2348123456789
</p>

<input
  id="phone"
  type="tel"
  inputmode="numeric"
  maxlength="15"
  placeholder="234xxxxxxxxxx"
>

<button
  id="pairButton"
  onclick="pairWhatsApp()"
>
🔗 Generate Pair Code
</button>

<div
  id="pairResult"
  class="result"
></div>

</div>


<div class="card">

<h2>🔐 Session</h2>

<div class="actions">

<button
  class="secondary"
  onclick="checkStatus()"
>
Check Status
</button>

<button
  class="secondary"
  onclick="logout()"
>
Logout
</button>

</div>

<div
  id="sessionResult"
  class="result"
></div>

</div>


<div class="footer">

QUEEN X • Simon Tech • 2026

</div>

</main>


<script>

let timer = null;


// ═══════════════════════════════════════
// LOAD USER
// ═══════════════════════════════════════

async function loadUser(){

  try{

    const response =
      await fetch(
        "/api/me",
        {
          credentials:"same-origin"
        }
      );

    if(
      response.status ===
      401
    ){

      window.location.href =
        "/login.html";

      return;

    }

    const data =
      await response.json();

    if(
      !data.success
    ){

      window.location.href =
        "/login.html";

      return;

    }

    document.getElementById(
      "user"
    ).textContent =
      "👤 " +
      data.user.username +
      " • " +
      data.user.email;

  }catch(error){

    console.error(error);

  }

}


// ═══════════════════════════════════════
// PAIR
// ═══════════════════════════════════════

async function pairWhatsApp(){

  const phone =
    document
      .getElementById("phone")
      .value
      .replace(/\D/g,"");

  const button =
    document.getElementById(
      "pairButton"
    );

  const result =
    document.getElementById(
      "pairResult"
    );

  if(
    phone.length < 10
  ){

    result.style.display =
      "block";

    result.innerHTML =
      '<div class="error">❌ Enter a valid international number.</div>';

    return;

  }

  button.disabled = true;

  button.textContent =
    "⏳ Generating...";

  result.style.display =
    "block";

  result.innerHTML =
    '<div class="info">⏳ Connecting to WhatsApp...</div>';

  try{

    const response =
      await fetch(
        "/api/pair",
        {
          method:"POST",
          credentials:"same-origin",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              phone:phone
            })
        }
      );

    const data =
      await response.json();

    if(
      response.status ===
      401
    ){

      window.location.href =
        "/login.html";

      return;

    }

    if(
      !response.ok ||
      !data.success
    ){

      throw new Error(
        data.message ||
        "Pairing failed."
      );

    }

    const code =
      String(
        data.code ||
        data.pairingCode ||
        ""
      )
      .replace(/-/g,"")
      .trim();

    if(!code){

      throw new Error(
        "No pairing code returned."
      );

    }

    const formatted =
      code
        .match(/.{1,4}/g)
        ?.join("-") ||
      code;

    result.innerHTML = `

      <div class="success">
        ✅ Pairing Code Generated
      </div>

      <div
        id="code"
        class="code"
      >
        ${escapeHtml(formatted)}
      </div>

      <div class="info">
        Open WhatsApp → Settings →
        Linked Devices → Link with phone number
        → enter the code.
      </div>

      <button
        onclick="copyCode()"
      >
        📋 Copy Code
      </button>

      <div
        id="timer"
        class="info"
        style="margin-top:10px;text-align:center"
      >
        ⏰ Code generated
      </div>

    `;

    startTimer();

  }catch(error){

    result.innerHTML =
      '<div class="error">❌ ' +
      escapeHtml(
        error.message
      ) +
      '</div>';

  }finally{

    button.disabled =
      false;

    button.textContent =
      "🔗 Generate Pair Code";

  }

}


// ═══════════════════════════════════════
// TIMER
// ═══════════════════════════════════════

function startTimer(){

  clearInterval(timer);

  let seconds = 60;

  const element =
    document.getElementById(
      "timer"
    );

  timer =
    setInterval(
      () => {

        seconds--;

        if(element){

          element.textContent =
            "⏰ Expires in " +
            seconds +
            "s";

        }

        if(
          seconds <= 0
        ){

          clearInterval(timer);

          if(element){

            element.textContent =
              "❌ Code expired.";

          }

        }

      },
      1000
    );

}


// ═══════════════════════════════════════
// COPY
// ═══════════════════════════════════════

async function copyCode(){

  const element =
    document.getElementById(
      "code"
    );

  if(!element) return;

  const code =
    element.textContent
      .replace(/-/g,"")
      .trim();

  try{

    await navigator.clipboard
      .writeText(code);

    alert(
      "✅ Pairing code copied."
    );

  }catch{

    alert(
      "Code: " + code
    );

  }

}


// ═══════════════════════════════════════
// STATUS
// ═══════════════════════════════════════

async function checkStatus(){

  const result =
    document.getElementById(
      "sessionResult"
    );

  result.style.display =
    "block";

  try{

    const response =
      await fetch(
        "/api/session",
        {
          credentials:"same-origin"
        }
      );

    const data =
      await response.json();

    if(
      response.status ===
      401
    ){

      window.location.href =
        "/login.html";

      return;

    }

    result.innerHTML = `

      <div class="success">
        ✅ Dashboard session active
      </div>

      <div class="info">
        👤 ${escapeHtml(
          data.user.username
        )}
        <br>
        📧 ${escapeHtml(
          data.user.email
        )}
        <br>
        📱 WhatsApp:
        ${escapeHtml(
          data.whatsapp.status
        )}
      </div>

    `;

  }catch(error){

    result.innerHTML =
      '<div class="error">❌ ' +
      escapeHtml(
        error.message
      ) +
      '</div>';

  }

}


// ═══════════════════════════════════════
// LOGOUT
// ═══════════════════════════════════════

async function logout(){

  try{

    await fetch(
      "/api/logout",
      {
        method:"POST",
        credentials:"same-origin"
      }
    );

  }finally{

    window.location.href =
      "/login.html";

  }

}


// ═══════════════════════════════════════
// ESCAPE HTML
// ═══════════════════════════════════════

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


loadUser();

</script>

</body>
</html>
