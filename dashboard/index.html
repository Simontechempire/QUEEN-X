<!DOCTYPE html>  <html lang="en">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Qᴜᴇᴇɴ X Dashboard</title>    <style>  
    * {  
      box-sizing: border-box;  
      margin: 0;  
      padding: 0;  
    }  
  
    body {  
      min-height: 100vh;  
      font-family: Arial, sans-serif;  
      background: #070707;  
      color: #fff;  
      display: flex;  
      justify-content: center;  
      padding: 30px;  
    }  
  
    .dashboard {  
      width: 100%;  
      max-width: 520px;  
      background: #999999;  
      border: 1px solid #292929;  
      border-radius: 24px;  
      padding: 30px;  
      box-shadow: 0 20px 60px rgba(0,0,0,.6);  
    }  
  
    .header {  
      text-align: center;  
      margin-bottom: 90px;  
    }  
  
    .header h1 {  
      font-size: 38px;  
      margin-bottom: 8px;  
    }  
  
    .header p {  
      color: #999;  
      font-size: 90px;  
    }  
  
    .status,  
    .card {  
      background: #181818;  
      border-radius: 16px;  
      padding: 20px;  
      margin-bottom: 16px;  
    }  
  
    .status-title {  
      color: #999;  
      font-size: 13px;  
      margin-bottom: 8px;  
    }  
  
    .online {  
      color: #55ff88;  
      font-weight: bold;  
    }  
  
    .card h2 {  
      font-size: 18px;  
      margin-bottom: 8px;  
    }  
  
    .card p {  
      color: #999;  
      font-size: 14px;  
      margin-bottom: 15px;  
    }  
  
    input {  
      width: 100%;  
      padding: 14px;  
      margin-bottom: 12px;  
      border: 1px solid #333;  
      border-radius: 12px;  
      background: #0b0b0b;  
      color: white;  
      outline: none;  
      font-size: 15px;  
    }  
  
    button {  
      width: 100%;  
      padding: 14px;  
      border: 0;  
      border-radius: 12px;  
      background: #fff;  
      color: #000;  
      font-weight: bold;  
      cursor: pointer;  
      font-size: 15px;  
      margin-top: 5px;  
    }  
  
    button:hover {  
      opacity: .85;  
    }  
  
    button:disabled {  
      opacity: .5;  
      cursor: not-allowed;  
    }  
  
    .result {  
      display: none;  
      margin-top: 15px;  
      padding: 16px;  
      border-radius: 12px;  
      background: #0b0b0b;  
      border: 1px solid #292929;  
      text-align: center;  
    }  
  
    .pair-code {  
      font-size: 25px;  
      font-weight: bold;  
      letter-spacing: 3px;  
      margin-top: 10px;  
      color: #55ff88;  
    }  
  
    .message {  
      color: #aaa;  
      font-size: 13px;  
      line-height: 1.5;  
    }  
  
    .error {  
      color: #ff6666;  
    }  
  
    .success {  
      color: #55ff88;  
    }  
  
    .footer {  
      text-align: center;  
      color: #666;  
      font-size: 12px;  
      margin-top: 25px;  
    }  
  </style>  </head>  <body>  <main class="dashboard">    <header class="header">  
    <h1>Qᴜᴇᴇɴ X</h1>  
    <p>WhatsApp MD Dashboard</p>  
  </header>    <section class="status">  
    <div class="status-title">BOT STATUS</div>  
    <div class="online">● ONLINE</div>  
  </section>    <!-- WHATSAPP -->    <section class="card">  <h2>📱 WhatsApp</h2>  

<p>  
  Connect your WhatsApp account to Qᴜᴇᴇɴ X  
  using a pairing code.  
</p>  

<input  
  id="phone"  
  type="tel"  
  placeholder="Enter number e.g. 2348012345678"  
  autocomplete="off"  
>  

<button  
  id="pairButton"  
  onclick="pairWhatsApp()"  
>  
  🔗 Link WhatsApp  
</button>  

<div  
  id="pairResult"  
  class="result"  
></div>

  </section>    <!-- SESSION -->    <section class="card">  <h2>🔐 Session</h2>  

<p>  
  Check the current WhatsApp connection.  
</p>  

<button onclick="sessionInfo()">  
  Session Manager  
</button>  

<div  
  id="sessionResult"  
  class="result"  
></div>

  </section>    <!-- BOT -->    <section class="card">  <h2>⚙️ Bot</h2>  

<p>  
  Access your Qᴜᴇᴇɴ X bot controls.  
</p>  

<button onclick="botSettings()">  
  Bot Settings  
</button>

  </section>    <div class="footer">  
    Qᴜᴇᴇɴ X • Powered by Simon Tech  
  </div>  </main>  <script>  
  
async function pairWhatsApp() {  
  
  const phoneInput =  
    document.getElementById("phone");  
  
  const button =  
    document.getElementById("pairButton");  
  
  const result =  
    document.getElementById("pairResult");  
  
  const phone =  
    phoneInput.value.trim();  
  
  if (!phone) {  
    showResult(  
      result,  
      "❌ Enter your WhatsApp number first.",  
      "error"  
    );  
    return;  
  }  
  
  button.disabled = true;  
  button.textContent = "⏳ Generating code...";  
  
  result.style.display = "block";  
  
  result.innerHTML =  
    `<div class="message">  
      Connecting to WhatsApp...  
    </div>`;  
  
  try {  
  
    const response =  
      await fetch("/api/pair", {  
        method: "POST",  
  
        headers: {  
          "Content-Type":  
            "application/json"  
        },  
  
        body: JSON.stringify({  
          phone  
        })  
      });  
  
    const data =  
      await response.json();  
  
    if (!response.ok || !data.success) {  
  
      throw new Error(  
        data.message ||  
        "Pairing request failed."  
      );  
    }  
  
    result.innerHTML = `  
      <div class="message success">  
        ✅ Pairing code generated  
      </div>  
  
      <div class="pair-code">  
        ${escapeHtml(data.code)}  
      </div>  
  
      <div class="message">  
        Open WhatsApp → Linked Devices  
        → Link a Device → Link with phone number  
        and enter this code.  
      </div>  
    `;  
  
  } catch (error) {  
  
    result.innerHTML = `  
      <div class="message error">  
        ❌ ${escapeHtml(error.message)}  
      </div>  
    `;  
  
  } finally {  
  
    button.disabled = false;  
    button.textContent = "🔗 Link WhatsApp";  
  
  }  
}  
  
  
async function sessionInfo() {  
  
  const result =  
    document.getElementById("sessionResult");  
  
  result.style.display = "block";  
  
  result.innerHTML =  
    `<div class="message">  
      ⏳ Checking WhatsApp session...  
    </div>`;  
  
  try {  
  
    const response =  
      await fetch("/api/session");  
  
    const data =  
      await response.json();  
  
    if (!response.ok || !data.success) {  
      throw new Error(  
        data.message ||  
        "Unable to check session."  
      );  
    }  
  
    result.innerHTML = `  
      <div class="message">  
        Status:  
        <strong>  
          ${escapeHtml(data.status || "Unknown")}  
        </strong>  
      </div>  
    `;  
  
  } catch (error) {  
  
    result.innerHTML = `  
      <div class="message error">  
        ❌ ${escapeHtml(error.message)}  
      </div>  
    `;  
  
  }  
}  
  
  
function botSettings() {  
  
  alert(  
    "⚙️ Bot settings will be connected next."  
  );  
  
}  
  
  
function showResult(  
  element,  
  message,  
  type  
) {  
  
  element.style.display = "block";  
  
  element.innerHTML =  
    `<div class="message ${type}">  
      ${escapeHtml(message)}  
    </div>`;  
}  
  
  
function escapeHtml(value) {  
  
  return String(value)  
    .replace(/&/g, "&amp;")  
    .replace(/</g, "&lt;")  
    .replace(/>/g, "&gt;")  
    .replace(/"/g, "&quot;")  
    .replace(/'/g, "&#039;");  
  
}  
  
</script>  </body>  
</html>
